name: Deploy automatico para cPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer Pull no cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_REPO_PATH: ${{ secrets.CPANEL_REPO_PATH }}

        run: |
          set -e

          echo "Solicitando atualizacao do repositorio no cPanel..."

          RESPONSE=$(curl --silent --show-error \
            -G \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "repository_root=${CPANEL_REPO_PATH}" \
            --data-urlencode "branch=main" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update")

          echo "Resposta do cPanel:"
          echo "$RESPONSE" | jq .

          STATUS=$(echo "$RESPONSE" | jq -r '.status // .result.status // 0')

          if [ "$STATUS" != "1" ]; then
            echo "ERRO: o cPanel nao conseguiu atualizar o repositorio."
            echo "$RESPONSE" | jq '.errors // .result.errors'
            exit 1
          fi

          echo "Pull realizado com sucesso."
